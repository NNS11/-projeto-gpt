<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Brasil GPT 🇧🇷🐐</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="sidebar">
    <h2>🇧🇷 Brasil GPT</h2>
    <button onclick="clearChat()">+ Novo Chat</button>
  </div>

  <div class="chat-area">
    <div id="chat-box"></div>

    <div class="input-area">
      <input type="text" id="input" placeholder="Pergunte algo ou gere imagem...">
      <button onclick="sendMessage()">Enviar</button>
      <button onclick="generateImage()">Imagem</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
